- company: "Meerge Africa"
  role: "Backend Engineer"
  type: "Contract"
  period:
    start: "Dec 2024"
    end: "Jul 2025"
  summary: "Multi-service food commerce platform connecting vendors, suppliers, delivery, and kitchens. I worked across four services (Supplier, Delivery, Customer, Kitchen), owned the Supplier service end to end, and stepped in as acting lead when the engineering lead left."
  highlights:
    - "Designed and led the Supplier service from scratch: a supplier lifecycle with four explicit states (pending, approved, rejected, suspended), full audit logging, and admin tooling. 500+ suppliers, about 50 products each, at pilot."
    - "Owned service-to-service communication across all four services: REST calls secured with JWTs scoped to specific service identities."
    - "Designed the Delivery database: assignments, status transitions, and a rider availability system. Riders pick their days (with a minimum) and time windows, and assignment only happens inside them. Added rider location with Google Geocoding."
    - "Designed the Kitchen database: customized food and menu items, allergies, dietary information, and food goals."
    - "Acted as backend lead for 8 weeks across a 7-engineer team. Reviewed architecture decisions, unblocked contributors, and kept shipping."
    - "Worked with the DevOps team on deployment: wrote Dockerfiles, fixed CI pipelines, and debugged deployment failures caused by misconfigured environments."
    - "Refactored bare-except blocks and swallowed exceptions into structured error handling with consistent response shapes and full logging. Silent failures became traceable."
    - "Reviewed PRs across the backend services, keeping conventions consistent across an evolving codebase."
    - "The pilot handled about 500 orders from about 500 users."
  stack: [Python, Django, Django REST Framework, PostgreSQL, Redis, Celery, Docker]

