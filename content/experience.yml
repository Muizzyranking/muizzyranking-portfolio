- company: "Anvila (HNG)"
  role: "Full-Stack Engineer, Team Lead"
  type: "Internship"
  period:
    start: "Apr 2026"
    end: "Jun 2026"
  summary: "Tech lead over an 11-engineer team (4 backend, 7 frontend) building Anvila, an AI-agent manifest generator. Users describe an agent, answer follow-up questions, preview the generated files, and publish them to GitHub. Shipped in under a month."
  highlights:
    - "Wrote the technical requirements document, made the feature calls, and split the backend work by experience: beginners took utilities, authentication, and the Redis cache helper, while the other senior engineer took the LLM adapters, conversation compression, and the message API layer."
    - "Owned database design and migrations for the whole team. Every engineer extended schemas I originally built, which kept the data layer consistent as the team grew."
    - "Built the prompt-to-manifest generation pipeline and its event-publishing layer, the path that turns a user's prompt into a set of customized agent manifest files. 30+ manifests generated in production use."
    - "Built publishing to GitHub: manifests go to a public org repo or the user's private account, with an install link. Matched skills are pulled from ClawHub and cached in the GitHub org so they're reused instead of re-fetched. Took over and finished the ClawHub integration after it hit problems."
    - "Decided where to use SSE versus regular requests, and chose SSE over WebSockets because the client never needs to push live messages. Status events ('thinking', 'matching skills') drive the UI while responses stream with a typing effect. Messages go by POST and are persisted, so a refresh never loses them."
    - "Designed token tracking per chat and in total, and the chat data model, so history stays readable."
    - "Frontend: designed the Next.js cookie-based auth, with server-side wrappers that attach auth to backend calls and refresh tokens automatically. Used Next as a proxy between frontend and backend, chose the libraries and styling, designed several pages, wrote a large share of the frontend code, and built client-side streaming."
    - "Fixed a chat bug no one else on the team could: a conversation stayed untitled in the UI after the first message."
    - "Wrote the startup scripts for the web server (Uvicorn workers) and the Celery worker with the DevOps team."
  stack: [Python, FastAPI, Next.js, PostgreSQL, Redis, Celery, SSE, GitHub API]

- company: "Taskingdom"
  role: "Backend Developer"
  type: "Contract"
  period:
    start: "Jul 2025"
    end: "Jan 2026"
  summary: "Task-based gaming platform with real-money payouts. Four distinct user roles (regular, VIP, business, influencer), strict permission boundaries, and abuse-prevention logic that had to survive both ephemeral and long-lived tasks."
  highlights:
    - "Built the webhook layer linking third-party game outcomes to internal payouts. Game ends, condition checks, reward fires, all idempotent."
    - "Designed the abuse-prevention layer: a hybrid Redis-TTL and join-table storage strategy that prevented reward farming across task resets, whether tasks were short-lived or non-expiring."
    - "Co-designed core schemas (user, task, reward, role) and the permission system that enforces what each user type can see and do."
    - "Moved heavy operations onto Celery workers behind Redis. User-facing endpoints stopped paying for image processing and external API roundtrips."
  stack: [Python, Django, Django Ninja, PostgreSQL, Redis, Celery, Docker]

